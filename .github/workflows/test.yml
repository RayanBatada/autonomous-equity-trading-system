name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Run tests
        env:
          # Tests never hit real APIs; placeholders satisfy pydantic-settings.
          FINNHUB_API_KEY: test
          NEWSAPI_KEY: test
          ALPACA_API_KEY: test
          ALPACA_API_SECRET: test
          ALPACA_BASE_URL: https://paper-api.alpaca.markets
          EDGAR_USER_AGENT: "CI Test (ci@example.com)"
        run: uv run pytest --tb=short
