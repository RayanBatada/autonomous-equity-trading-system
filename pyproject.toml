[project]
name = "sma"
version = "0.1.0"
description = "Stock Market Predictor Agents: Phase 0 data ingestion (data layer)"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1.0",
    "httpx>=0.27.0",
    "yfinance>=1.5",
    "alpaca-py>=0.30.0",
    "requests>=2.31",  # transient dep of alpaca-py; imported directly for its
                        # exception types by sma.live.alpaca_client's retry armor
    "python-dotenv>=1.0",  # transient dep of pydantic-settings; imported directly
                            # by sma.ingest.notify._ensure_dotenv_loaded to close
                            # the .env-not-in-os.environ gap (see that docstring)
    "finnhub-python>=2.4.20",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "loguru>=0.7",
    "python-dateutil>=2.9",
    "click>=8.1",
    # Floor raised 2.0 -> 3.2 on 2026-07-30. Deployed models are pickled, and an
    # xgboost pickle is not guaranteed to load under a different MAJOR version —
    # a resolve that ignored uv.lock could have installed 2.x and failed to load
    # the live artifact. The floor now matches what actually trained them
    # (recorded per-artifact in `library_versions`).
    "xgboost>=3.2",
    "scikit-learn>=1.8.0",
    "anthropic>=0.40.0",
    "lxml>=6.1.0",
    "pdfplumber>=0.11.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-recording>=0.13",
    "vcrpy>=6.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "freezegun>=1.5",
    "streamlit>=1.30",
    "plotly>=5.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sma"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "live: hits real APIs; skipped without RUN_LIVE_TESTS=1",
    "serial: does real, substantial disk I/O whose byte-level assertions are measurably sensitive to concurrent resource contention (confirmed 2026-09-02: DuckDB CHECKPOINT/COPY-FROM-DATABASE file-size accounting shifts under concurrent load) -- must run with no other pytest-xdist worker active. Excluded from the -n 2/-n auto parallel pass; CI runs it separately (see .github/workflows/test.yml).",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Tests sometimes assert "raises something" with bare Exception, use one-line
# fixture setters with semicolons, or shadow OHLC unpacking with `l` for low.
# These are conveniences in test setup, not bugs in the code under test.
# N803/N806: X is standard ML notation for a feature matrix.
"tests/**/*" = ["B017", "E702", "E741", "N803", "N806"]
# One-off research/analysis scripts (IC studies, backfills, A/B grids) are
# terse exploratory code — allow compact one-liners and ML notation, but keep
# F-rules (dead imports/vars are real bugs even in scripts).
"scripts/**/*" = ["E701", "E702", "E501", "N806", "N803", "N812"]
# scripts/pit/** are durable EXPERIMENT-RECORD scratch (survivorship / regime /
# feature studies) kept for reproducibility — allow the scratch import style
# (sys.path setup before imports) and terse zips on top of the scripts rules.
"scripts/pit/**/*" = ["E701", "E702", "E501", "N806", "N803", "N812", "N816", "E402", "B905"]

[dependency-groups]
dev = [
    "pytest-xdist>=3.8.0",
]
